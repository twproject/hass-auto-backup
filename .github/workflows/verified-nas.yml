name: Verified NAS regression tests
on: [push, pull_request, workflow_dispatch]
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_verified_nas.py -v
      - run: python -m unittest discover -s tests -p test_control_policy.py -v
      - run: python -m unittest discover -s tests -p test_control_request.py -v
      - run: python -m compileall -q custom_components/auto_backup
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_frontend_translations.mjs
      - run: node --check custom_components/auto_backup/frontend/panel-v2.js
